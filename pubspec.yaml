name: network_reachability
description: An advanced network monitoring and resilience library for Flutter, powered by a high-performance Rust core.

version: 0.0.1+4

repository: https://github.com/MostafaSensei106/Network-Reachability

license: GPL-version 3.0

funding:
- https://github.com/sponsors/MostafaSensei106
- https://buymeacoffee.com/7yz1lqkegy
- https://ipn.eg/S/mostafasensei106/instapay/0dlUfz

topics:
- network
- reachability
- connectivity
- utils

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.12.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.29.0

  ffi: ^2.1.3
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        default_package: network_reachability

  assets:
  - web/pkg/
